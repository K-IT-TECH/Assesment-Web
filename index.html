<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice room · INX Academy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#20372f;font:16px/1.55 system-ui,sans-serif}header{background:#173c33;color:white}nav,main{max-width:1020px;margin:auto;padding:22px clamp(18px,5vw,56px)}nav,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}nav strong{font-size:21px;letter-spacing:-1px}nav a{color:#dbf4df;font-size:14px}main{padding-top:clamp(32px,6vw,76px)}h1{font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.065em;margin:0 0 16px}p{color:#50675d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:32px 0}.card,article{background:white;border:1px solid #cedbd1;border-radius:18px;padding:24px}.card{text-align:left;display:grid;gap:12px;color:inherit}.card strong{font-size:23px}.card small{font-size:14px;color:#52665a}.card:hover,.choice:hover{border-color:#21765a}progress{width:100%;height:8px;accent-color:#21765a}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #007fbe;outline-offset:3px}.action,.choice{border:1px solid #9eb9a9;border-radius:9px;background:white;color:#173c33;padding:10px 16px}.primary{background:#195b47;color:white}.choice{display:block;width:100%;text-align:left;margin:8px 0}.right{background:#d7f3df}.wrong{background:#ffe6df}.choice:disabled{cursor:default}.action:disabled{opacity:.45}article{max-width:720px;margin:16px auto}h2{line-height:1.25}#feedback{min-height:1.55em}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.card,article{padding:18px}nav{padding-block:16px}}
</style></head><body><header><nav><strong>INX Academy</strong><a href="./main%20index.html">Coding tools &amp; exams ↗</a></nav></header><main><section id="home"><h1>Practice room</h1><p>Choose a track. Answer at your own pace and pick up where you left off on this browser.</p><div class="grid" id="tracks"></div></section><section id="lesson" hidden><button id="back" class="action">← All tracks</button><article><p id="pos"></p><h2 id="question" tabindex="-1"></h2><div id="choices"></div><p role="status" id="feedback"></p><div class="row"><button class="action" id="prev">Previous</button><button class="action primary" id="next">Next question</button></div></article></section><p role="status" id="notice"></p></main><script>

            { id: 'ds_17', track: 'DS', question: '17. What technique resolves hash collisions by chaining linked lists?', options: ['Open Addressing', 'Separate Chaining', 'Linear Probing', 'Double Hashing'], correct: 1, exp: 'Separate chaining stores collided keys in buckets.' },
            { id: 'ds_18', track: 'DS', question: '18. Graph traversal algorithm using Queue data structure?', options: ['DFS', 'BFS', 'Dijkstra', 'Kruskal'], correct: 1, exp: 'Breadth-First Search uses Queues.' },
            { id: 'ds_19', track: 'DS', question: '19. Graph traversal algorithm using Stack data structure?', options: ['BFS', 'DFS', 'Prim', 'Bellman-Ford'], correct: 1, exp: 'Depth-First Search uses Stacks/Recursion.' },
            { id: 'ds_20', track: 'DS', question: '20. Height of a balanced binary tree with N nodes?', options: ['O(N)', 'O(log N)', 'O(1)', 'O(N log N)'], correct: 1, exp: 'Balanced tree height scales logarithmically O(log N).' },

            { id: 'py_1', track: 'PYTHON', question: '1. Keyword used to define functions in Python?', options: ['func', 'def', 'function', 'define'], correct: 1, exp: '"def" declares Python functions.' },
            { id: 'py_2', track: 'PYTHON', question: '2. Which Python type stores immutable ordered sequences?', options: ['List', 'Dictionary', 'Tuple', 'Set'], correct: 2, exp: 'Tuples are immutable sequences.' },
            { id: 'py_3', track: 'PYTHON', question: '3. How to append an element to a Python list?', options: ['add()', 'push()', 'append()', 'insert()'], correct: 2, exp: 'append() adds elements to list ends.' },
            { id: 'py_4', track: 'PYTHON', question: '4. Class constructor method name in Python?', options: ['__init__', 'constructor()', 'create()', 'new()'], correct: 0, exp: '__init__() is the object initializer.' },

            { id: 'py_6', track: 'PYTHON', question: '6. Output of print(type([])) in Python?', options: ['<class "array">', '<class "list">', '<class "tuple">', '<class "set">'], correct: 1, exp: 'Square brackets define lists.' },
            { id: 'py_7', track: 'PYTHON', question: '7. How do you start a single-line comment in Python?', options: ['//', '/*', '#', '--'], correct: 2, exp: '# starts single-line comments.' },
            { id: 'py_8', track: 'PYTHON', question: '8. Which built-in function returns sequence lengths?', options: ['size()', 'length()', 'len()', 'count()'], correct: 2, exp: 'len() measures collection lengths.' },
            { id: 'py_9', track: 'PYTHON', question: '9. What keyword creates anonymous inline functions in Python?', options: ['def', 'lambda', 'anonymous', 'func'], correct: 1, exp: 'lambda defines small anonymous functions.' },
            { id: 'py_10', track: 'PYTHON', question: '10. Which data structure stores key-value pairs in Python?', options: ['List', 'Set', 'Dictionary', 'Tuple'], correct: 2, exp: 'Dictionaries store key-value pairs.' },
            { id: 'py_11', track: 'PYTHON', question: '11. Output of 2 ** 3 in Python?', options: ['6', '8', '9', '5'], correct: 1, exp: '** is exponentiation operator (2^3 = 8).' },
            { id: 'py_12', track: 'PYTHON', question: '12. What keyword handles exceptions in Python block structures?', options: ['catch', 'except', 'error', 'handle'], correct: 1, exp: 'try-except handles raised errors.' },
            { id: 'py_13', track: 'PYTHON', question: '13. How to convert string "123" to integer in Python?', options: ['int("123")', 'Integer("123")', 'parse("123")', 'to_int("123")'], correct: 0, exp: 'int() converts string representations to integers.' },
            { id: 'py_14', track: 'PYTHON', question: '14. Output of bool("") in Python?', options: ['True', 'False', 'None', 'Error'], correct: 1, exp: 'Empty strings evaluate to False.' },
            { id: 'py_15', track: 'PYTHON', question: '15. Which statement terminates loop execution in Python?', options: ['exit', 'stop', 'break', 'skip'], correct: 2, exp: 'break exits loops.' },
            { id: 'py_16', track: 'PYTHON', question: '16. Which method removes and returns an item from a list in Python?', options: ['pop()', 'remove()', 'delete()', 'extract()'], correct: 0, exp: 'pop() removes elements by index.' },
            { id: 'py_17', track: 'PYTHON', question: '17. How do you create an empty set in Python?', options: ['{}', 'set()', '[]', '()'], correct: 1, exp: '{} creates empty dicts; set() creates empty sets.' },
            { id: 'py_18', track: 'PYTHON', question: '18. Which library is used for array computing in Python?', options: ['Pandas', 'NumPy', 'Flask', 'Django'], correct: 1, exp: 'NumPy supports high-performance arrays.' },
            { id: 'py_19', track: 'PYTHON', question: '19. What does the "is" operator check in Python?', options: ['Value Equality', 'Object Identity', 'Data Type', 'Length'], correct: 1, exp: '"is" checks if variables point to same object.' },
            { id: 'py_20', track: 'PYTHON', question: '20. Output of "a" + "b" in Python?', options: ['ab', 'a b', 'Error', '2'], correct: 0, exp: '+ concatenates strings.' },

            // HTML & WEB DEV (20)
            { id: 'web_1', track: 'HTML', question: '1. Which HTML tag displays top-level headings?', options: ['<h6>', '<head>', '<h1>', '<header>'], correct: 2, exp: '<h1> renders top headings.' },
            { id: 'web_2', track: 'HTML', question: '2. CSS property that sets text color?', options: ['font-color', 'color', 'text-style', 'background-color'], correct: 1, exp: '"color" specifies text color.' },
            { id: 'web_3', track: 'HTML', question: '3. HTML tag for creating hyperlinks?', options: ['<link>', '<a>', '<href>', '<nav>'], correct: 1, exp: 'Anchor <a> creates hyperlinks.' },
            { id: 'web_4', track: 'HTML', question: '4. CSS layout model for 1D row/column alignment?', options: ['Grid', 'Flexbox', 'Position', 'Float'], correct: 1, exp: 'Flexbox handles 1D layout alignments.' },
            { id: 'web_5', track: 'HTML', question: '5. Required accessibility attribute on <img> elements?', options: ['src', 'alt', 'title', 'href'], correct: 1, exp: '"alt" provides image text descriptions.' },
            { id: 'web_6', track: 'HTML', question: '6. HTML tag used to insert JavaScript code?', options: ['<js>', '<javascript>', '<script>', '<code>'], correct: 2, exp: '<script> embeds client-side scripts.' },
            { id: 'web_7', track: 'HTML', question: '7. CSS property that adjusts inner element padding space?', options: ['margin', 'padding', 'border', 'spacing'], correct: 1, exp: 'padding adjusts internal spacing.' },
            { id: 'web_8', track: 'HTML', question: '8. Which CSS selector selects elements with id="header"?', options: ['.header', '#header', '*header', 'header'], correct: 1, exp: '# selects element IDs.' },
            { id: 'web_9', track: 'HTML', question: '9. HTML element used to define unordered bullet lists?', options: ['<ol>', '<ul>', '<li>', '<list>'], correct: 1, exp: '<ul> creates bulleted lists.' },
            { id: 'web_10', track: 'HTML', question: '10. HTML attribute specifying form submission destinations?', options: ['method', 'action', 'target', 'href'], correct: 1, exp: 'action specifies handling URLs.' },
            { id: 'web_11', track: 'HTML', question: '11. Which CSS property makes element text bold?', options: ['font-style', 'font-weight', 'text-transform', 'font-size'], correct: 1, exp: 'font-weight: bold sets heavy font weight.' },
            { id: 'web_12', track: 'HTML', question: '12. What does DOM stand for in Web Development?', options: ['Document Object Model', 'Data Object Mode', 'Digital Output Method', 'Desktop Oriented Model'], correct: 0, exp: 'DOM represents document tree structures.' },
            { id: 'web_13', track: 'HTML', question: '13. HTML5 tag used for embedding video files?', options: ['<media>', '<video>', '<movie>', '<embed>'], correct: 1, exp: '<video> plays media clips natively.' },
            { id: 'web_14', track: 'HTML', question: '14. CSS display property value that hides elements completely?', options: ['hidden', 'none', 'invisible', 'block'], correct: 1, exp: 'display: none removes elements from flow.' },
            { id: 'web_15', track: 'HTML', question: '15. Which HTTP method is used to retrieve data from web servers?', options: ['POST', 'GET', 'PUT', 'DELETE'], correct: 1, exp: 'GET fetches data without side effects.' },
            { id: 'web_16', track: 'HTML', question: '16. Which CSS unit is relative to root font size?', options: ['em', 'rem', 'px', 'pt'], correct: 1, exp: 'rem scales relative to html root element.' },
            { id: 'web_17', track: 'HTML', question: '17. Semantic HTML tag used to define navigation menu links?', options: ['<nav>', '<menu>', '<header>', '<section>'], correct: 0, exp: '<nav> encloses navigation links.' },
            { id: 'web_18', track: 'HTML', question: '18. CSS property used to create 2D layout grid systems?', options: ['flex', 'display: grid', 'float', 'position'], correct: 1, exp: 'grid enables 2D layout controls.' },
            { id: 'web_19', track: 'HTML', question: '19. JavaScript keyword used to declare block-scoped variables?', options: ['var', 'let', 'global', 'set'], correct: 1, exp: 'let declares block-scoped variables.' },
            { id: 'web_20', track: 'HTML', question: '20. What HTML meta tag ensures responsive scaling on mobile devices?', options: ['charset', 'viewport', 'description', 'keywords'], correct: 1, exp: 'viewport controls screen scaling on mobile browsers.' }
        ];
const labels={C:'C programming',DS:'Data structures',PYTHON:'Python',HTML:'Web development'};
const byId=id=>document.getElementById(id);
const list=track=>bank.filter(q=>q.track===track);
const key='inx-practice-v1';
let answers={},positions={},track='C',index=0;
try {
 const saved=JSON.parse(localStorage.getItem(key)||'{}');
 for(const q of bank){const value=saved?.answers?.[q.id];if(Number.isInteger(value)&&value>=0&&value<q.options.length)answers[q.id]=value;}
 for(const t of Object.keys(labels)){const p=saved?.positions?.[t];if(Number.isInteger(p)&&p>=0&&p<list(t).length)positions[t]=p;}
} catch {byId('notice').textContent='Previous progress could not be loaded.';}
function save(){try{localStorage.setItem(key,JSON.stringify({answers,positions}));}catch{byId('notice').textContent='Storage unavailable. Progress lasts for this visit.';}}
function element(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node;}
function home(){
 byId('home').hidden=false;byId('lesson').hidden=true;byId('tracks').replaceChildren();
 for(const [t,title] of Object.entries(labels)){
  const questions=list(t),done=questions.filter(q=>q.id in answers).length;
  const card=element('button','','card'),bar=document.createElement('progress');bar.max=questions.length;bar.value=done;bar.setAttribute('aria-label',title+' progress');
  card.append(element('strong',title),element('small',done+' of '+questions.length+' answered · '+questions.filter(q=>answers[q.id]===q.correct).length+' correct'),bar,element('span',done===questions.length?'Review answers →':done?'Continue practice →':'Start practice →'));
  card.onclick=()=>{track=t;index=positions[t]||0;byId('home').hidden=true;byId('lesson').hidden=false;render();byId('question').focus();};
  byId('tracks').append(card);
 }
}
function render(){
 const questions=list(track),q=questions[index],chosen=answers[q.id],locked=chosen!==undefined;
 byId('pos').textContent=labels[track]+' · Question '+(index+1)+' of '+questions.length;
 byId('question').textContent=q.question.replace(/^\d+\.\s*/,'');byId('choices').replaceChildren();
 q.options.forEach((text,i)=>{const btn=element('button',text,'choice');btn.disabled=locked;
  if(locked&&i===q.correct)btn.classList.add('right');else if(locked&&i===chosen)btn.classList.add('wrong');
  btn.onclick=()=>{answers[q.id]=i;save();render();byId('next').focus();};byId('choices').append(btn);});
 byId('feedback').textContent=locked?(chosen===q.correct?'Correct. ':'Correct answer: '+q.options[q.correct]+'. ')+q.exp:'';
 byId('prev').disabled=index===0;byId('next').textContent=index===questions.length-1?'Back to tracks':'Next question';
}
function move(step){index+=step;positions[track]=index;save();render();byId('question').focus();}
function leave(){home();byId('tracks').children[Object.keys(labels).indexOf(track)].focus();}
byId('prev').onclick=()=>move(-1);byId('next').onclick=()=>index===list(track).length-1?leave():move(1);byId('back').onclick=leave;home();
</script></body></html>
